# 率カナリア (PR-5c-1) の監視リスト。scripts/sync/rate-watch.ts が読む (Gemini は使わない = 0 req)。
#
# 週次 cron の抽出 (Gemini) とは別の経路で、seed の率の根拠になった公式ページの逐語句が今も載っているかを
# 素の HTTP GET で照合する。検知だけで seed は書き換えない。仕組みと手動プローブの手順はルート README の
# 「率カナリア (0 req)」、位置づけは sources/README。
#
# 規約 (scripts/sync/rate-watch.test.ts の契約テストが npm test = cron の safety gate でも検査する):
#   - url は実際に開いて逐語を確認したものだけ (捏造禁止。確認日を notes に書く)。https のみ。
#   - phrases は正規化 (NFKC・空白の圧縮・3 桁カンマ除去・数字と 倍/%/pt の間の空白除去) 後の部分一致。
#     anchor の各出現位置の前後 window 字 (既定 300、50〜2000) に全部そろえば match。
#   - seedRateAtCuration は照合句を確かめたときの seed の率 (program = PROGRAM_OVERRIDES 適用後の rate /
#     card = defaultRate / membership = overrideRate ?? program.rate)。seed の値と完全一致が契約。
#     **seed の率を直す PR では、ここも同じ PR で更新する** (しないと CI が落ちる)。
#   - 監視する program (membership の program を含む) は validTo を持たない常設だけ。
#   - membership の subject は { programId, storeId } で書く (id は membershipId() で組む。raw id 直書き禁止)。
#   - storeSet は一覧ページの店名集合の fingerprint (欠けた店名 = storeMissing)。subject は kind: category。
#   - priority: 1 = 開発者の保有カード (JCB W / EPOS) の高還元 (10% 級) / 2 = 保有カードのその他 /
#     3 = 非保有カードの高影響 / 4 = 参考。
#   - 監視中の subject への cron の updateField / delete は diff-and-propose の Phase C5 (guardRateWatched) が
#     rateWatched で review に回す (auto で seed が変わると上の契約が safety gate で落ちるため)。
#   - candidates は到達性プローブ (--probe) 専用で照合しない。URL はリポジトリ (registry.yaml / seed) に既にあるものだけ。
#   - excluded は意図して監視しない subject と理由 (実在は求めない。期限切れ整理で消える campaign も書くため)。

